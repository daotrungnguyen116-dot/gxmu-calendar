
name: Generate Exam Calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ICS
        run: python exampreparation26winter

      - name: Commit ICS to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam_preparation_2026_2027.ics
          git diff --cached --quiet || git commit -m "Update exam calendar"
          git push

      - name: Upload ICS file
        uses: actions/upload-artifact@v4
        with:
          name: exam-preparation-calendar
          path: exam_preparation_2026_2027.ics
